server:
  port: 8081

spring:
  application:
    name: careflow-patient-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/careflow_patient_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
